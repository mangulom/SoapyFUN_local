[project]
name = "soapyfun-api"
version = "0.1.0"
description = "API de gestión integral para jabonería artesanal SoapyFUN"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.8,<3.0",
  "email-validator>=2.2,<3.0",
  "psycopg2-binary>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
